audio:
  chunk_size: 176128
  dim_f: 1024
  dim_t: 256
  hop_length: 512
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.001

model:
  dim: 192
  depth: 4
  stereo: true
  num_stems: 2
  time_transformer_depth: 1
  freq_transformer_depth: 1
  linear_transformer_depth: 0
  num_bands: 48
  dim_head: 64
  heads: 6
  attn_dropout: 0.1
  ff_dropout: 0.1
  flash_attn: True
  dim_freqs_in: 1025
  sample_rate: 44100
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: False
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
    - 4096
    - 2048
    - 1024
    - 512
    - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: False
  mlp_expansion_factor: 4
  use_torch_checkpoint: True
  skip_connection: True

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  instruments:
    - lead_guitar
    - rhythm_guitar
  lr: 3.0e-04
  patience: 10
  reduce_factor: 0.95
  target_instrument: null
  num_epochs: 50
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: false
  ema_momentum: 0.999
  optimizer: adamw
  weight_decay: 0.01
  scheduler: cosine
  num_warmup_steps: 1000
  other_fix: false
  use_amp: true

loss:
  l1_waveform: true
  l1_waveform_coef: 1.0
  multi_stft: true
  multi_stft_coef: 1.0
  spectral_convergence: true
  spectral_convergence_coef: 0.5
  si_sdr: true
  si_sdr_coef: 0.1
  stem_leakage: true
  stem_leakage_coef: 0.3
  stereo_consistency: true
  stereo_consistency_coef: 0.2
  center_aware_lead: true
  center_aware_lead_coef: 0.4

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.7
  loudness_max: 1.3
  stereo_width: true
  stereo_width_min: 0.5
  stereo_width_max: 1.5
  eq: true
  cabinet: true
  saturation: true
  saturation_drive_min: 0.0
  saturation_drive_max: 0.3
  reverb: true
  reverb_wet_min: 0.0
  reverb_wet_max: 0.15
  panning: true
  panning_min: 0.8
  panning_max: 1.0
  ms_rotation: true
  ms_rotation_angle_max: 15.0
  time_mask: true
  time_mask_max_sec: 0.3
  freq_mask: true
  freq_mask_max_bands: 3

inference:
  batch_size: 2
  dim_t: 256
  num_overlap: 4
  wiener_refinement: true
  wiener_alpha: 0.5
  post_process: true
  transient_enhance: true
  harmonic_enhance: true
  spectral_denoise: true
  stereo_restore: true
