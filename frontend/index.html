<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101212" />
    <meta name="description" content="AI-powered audio stem separation workspace." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StemSplit AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/pwa-192.png" />
    <link rel="apple-touch-icon" href="/static/pwa-192.png" />
    <title>StemSplit AI</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #101212;
      }

      .initial-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #e8ece8;
        background:
          radial-gradient(circle at 50% 20%, rgba(0, 227, 136, 0.16), transparent 32%),
          linear-gradient(180deg, #151818 0%, #101212 100%);
        font-family: Inter, system-ui, sans-serif;
      }

      .initial-splash-card {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .initial-splash-mark {
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(0, 227, 136, 0.28);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      }

      .initial-splash-mark img {
        width: 64px;
        height: 64px;
        display: block;
      }

      .initial-splash-title {
        margin: 4px 0 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .initial-splash-subtitle {
        margin: 0;
        color: rgba(214, 226, 214, 0.66);
        font-size: 13px;
      }

      .initial-splash-progress {
        width: min(220px, 76vw);
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .initial-splash-progress span {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00e388, #4fc3f7);
        animation: splash-load 1.1s ease-in-out infinite alternate;
      }

      @keyframes splash-load {
        from {
          transform: translateX(-70%);
        }
        to {
          transform: translateX(190%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-splash" aria-label="Loading StemSplit AI">
        <section class="initial-splash-card">
          <div class="initial-splash-mark">
            <img src="/static/pwa-192.png" alt="" />
          </div>
          <div>
            <h1 class="initial-splash-title">StemSplit AI</h1>
            <p class="initial-splash-subtitle">Preparing your audio workspace</p>
          </div>
          <div class="initial-splash-progress" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
