services:
  api:
    build: .
    container_name: stemsplit-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      STEM_ENV: development
      STEM_DATABASE_URL: postgresql+psycopg://stemsplit:stemsplit@postgres:5432/stemsplit
      STEM_MONGO_URI: mongodb://mongo:27017
      STEM_REDIS_URL: redis://redis:6379/0
      STEM_QUEUE_BACKEND: rq
      STEM_STORAGE_BACKEND: local
      STEM_STORAGE_LOCAL_DIR: /app/storage
      STEM_PUBLIC_BASE_URL: http://127.0.0.1:8000
      STEM_AUTH_SECRET_KEY: change-me-before-production
      PYTHONUNBUFFERED: "1"
    volumes:
      - storage-data:/app/storage
      - upload-data:/app/uploads
      - separated-data:/app/separated/web
      - ./web/static:/app/web/static
      - ./saas:/app/saas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    container_name: stemsplit-worker
    command: ["python", "-m", "saas.worker"]
    env_file:
      - .env
    environment:
      STEM_ENV: development
      STEM_DATABASE_URL: postgresql+psycopg://stemsplit:stemsplit@postgres:5432/stemsplit
      STEM_MONGO_URI: mongodb://mongo:27017
      STEM_REDIS_URL: redis://redis:6379/0
      STEM_QUEUE_BACKEND: rq
      STEM_STORAGE_BACKEND: local
      STEM_STORAGE_LOCAL_DIR: /app/storage
      STEM_PUBLIC_BASE_URL: http://127.0.0.1:8000
      STEM_AUTH_SECRET_KEY: change-me-before-production
      PYTHONUNBUFFERED: "1"
    volumes:
      - storage-data:/app/storage
      - upload-data:/app/uploads
      - separated-data:/app/separated/web
      - ./saas:/app/saas
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: stemsplit-postgres
    environment:
      POSTGRES_DB: stemsplit
      POSTGRES_USER: stemsplit
      POSTGRES_PASSWORD: stemsplit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stemsplit -d stemsplit"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: stemsplit-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stemsplit-redis
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  storage-data:
  upload-data:
  separated-data:
