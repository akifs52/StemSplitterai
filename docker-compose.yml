services:
  api:
    build: .
    container_name: stemsplit-api
    ports:
      - "8000:8000"
    environment:
      STEM_ENV: development
      STEM_DATABASE_URL: postgresql+psycopg://stemsplit:stemsplit@postgres:5432/stemsplit
      STEM_MONGO_URI: mongodb://mongo:27017
      STEM_REDIS_URL: redis://redis:6379/0
      STEM_QUEUE_BACKEND: rq
      STEM_STORAGE_BACKEND: s3
      STEM_S3_ENDPOINT_URL: http://minio:9000
      STEM_S3_BUCKET: stemsplit
      STEM_S3_ACCESS_KEY_ID: stemsplit
      STEM_S3_SECRET_ACCESS_KEY: stemsplit-secret
      STEM_PUBLIC_BASE_URL: http://127.0.0.1:8000
      STEM_AUTH_SECRET_KEY: change-me-before-production
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    container_name: stemsplit-worker
    command: ["python", "-m", "saas.worker"]
    environment:
      STEM_ENV: development
      STEM_DATABASE_URL: postgresql+psycopg://stemsplit:stemsplit@postgres:5432/stemsplit
      STEM_MONGO_URI: mongodb://mongo:27017
      STEM_REDIS_URL: redis://redis:6379/0
      STEM_QUEUE_BACKEND: rq
      STEM_STORAGE_BACKEND: s3
      STEM_S3_ENDPOINT_URL: http://minio:9000
      STEM_S3_BUCKET: stemsplit
      STEM_S3_ACCESS_KEY_ID: stemsplit
      STEM_S3_SECRET_ACCESS_KEY: stemsplit-secret
      STEM_PUBLIC_BASE_URL: http://127.0.0.1:8000
      STEM_AUTH_SECRET_KEY: change-me-before-production
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: stemsplit-postgres
    environment:
      POSTGRES_DB: stemsplit
      POSTGRES_USER: stemsplit
      POSTGRES_PASSWORD: stemsplit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stemsplit -d stemsplit"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: stemsplit-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stemsplit-redis
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stemsplit-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: stemsplit
      MINIO_ROOT_PASSWORD: stemsplit-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 stemsplit stemsplit-secret; do sleep 2; done;
      mc mb --ignore-existing local/stemsplit;
      "

volumes:
  postgres-data:
  mongo-data:
  minio-data:
